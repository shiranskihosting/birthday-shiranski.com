<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מזל טוב! מתנה משירנסקי מארח</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:url" content="https://birthday.shiranski.com/">
<meta property="og:title" content="מזל טוב! 🎉 מתנה קטנה משירנסקי מארח">
<meta property="og:description" content="10% הנחה על ערב אצל שירנסקי מארח, לכבוד יום ההולדת.">
<meta property="og:image" content="https://birthday.shiranski.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@700&family=Playpen+Sans+Hebrew&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0c0a;--panel:#16140f;--gold:#d9b765;--gold2:#f6e3a1;--gold3:#a8822f;--muted:#b9a777}
*{margin:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--gold2);font-family:Assistant,sans-serif}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse at 50% 0%,#2a2416 0%,var(--bg) 60%)}
.g{background:linear-gradient(180deg,var(--gold2) 0%,var(--gold) 45%,var(--gold3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{position:relative;overflow:hidden;width:100%;max-width:520px;border:2px solid var(--gold);outline:1px solid var(--gold3);outline-offset:-10px;
  padding:52px 28px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.25)}
.card>*{position:relative;z-index:1}
.spark{position:absolute;inset:0;z-index:0;pointer-events:none}
.top{font-size:15px;letter-spacing:.35em;color:var(--gold);margin-bottom:10px}
.hi{font-family:'Playpen Sans Hebrew',cursive;font-size:clamp(40px,11vw,58px);line-height:1.25;word-break:break-word;font-weight:400}
.rule{width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px 0 4px}
.txt{font-size:clamp(19px,5vw,23px);line-height:1.6;margin-top:12px;max-width:400px;color:#efe2bd}
.gift{margin-top:30px;border:1.5px solid var(--gold);border-radius:14px;padding:22px 26px;width:100%;max-width:340px;
  background:linear-gradient(180deg,rgba(217,183,101,.10),rgba(217,183,101,.02));box-shadow:0 0 30px rgba(217,183,101,.12) inset}
.gift .s{font-size:18px;color:#efe2bd}
.gift .big{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:78px;line-height:1.1}
.gift .v{font-size:15px;color:var(--muted);margin-top:6px}
.btn{margin-top:28px;display:inline-block;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));color:#14110a;text-decoration:none;font-weight:700;font-size:20px;
  padding:14px 32px;border-radius:999px;box-shadow:0 4px 18px rgba(217,183,101,.25)}
.btn:active{transform:scale(.98)}
.sig{font-family:'Playpen Sans Hebrew',cursive;font-size:24px;margin-top:26px}
.logo{width:120px;margin-top:20px}
.terms{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5;max-width:360px;opacity:.85}
</style>
</head>
<body>
<main class="card">
  <svg class="spark" viewBox="0 0 520 900" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#d9b765">
      <circle cx="48" cy="70" r="2.5"/><circle cx="470" cy="96" r="2"/><circle cx="90" cy="180" r="1.5"/><circle cx="440" cy="210" r="2.5"/>
      <circle cx="30" cy="420" r="2"/><circle cx="492" cy="470" r="1.5"/><circle cx="60" cy="640" r="2"/><circle cx="465" cy="700" r="2.5"/>
      <circle cx="120" cy="820" r="1.5"/><circle cx="400" cy="850" r="2"/>
      <path d="M432 40l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/><path d="M80 115l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
      <path d="M478 330l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z"/><path d="M42 300l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
      <path d="M470 600l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M50 760l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z"/>
      <rect x="140" y="50" width="6" height="2" transform="rotate(30 143 51)"/><rect x="380" y="150" width="7" height="2" transform="rotate(-40 383 151)"/>
      <rect x="20" y="540" width="7" height="2" transform="rotate(60 23 541)"/><rect x="500" y="800" width="6" height="2" transform="rotate(-20 503 801)"/>
    </g>
  </svg>
  <div class="top">✦ HAPPY BIRTHDAY ✦</div>
  <h1 class="hi g" id="hi">מזל טוב!</h1>
  <div class="rule"></div>
  <p class="txt">יום הולדת שמח! מאחל לך שנה של שולחנות מלאים, אנשים טובים ורגעים שמתחשק לחגוג.</p>
  <div class="gift">
    <div class="s">מתנה קטנה ממני</div>
    <div class="big g">10%</div>
    <div class="s">הנחה על ערב אצל <span style="white-space:nowrap">שירנסקי מארח</span></div>
    <div class="v" id="valid" hidden></div>
  </div>
  <a class="btn" id="book" href="https://tally.so/r/EkRN1A" target="_blank" rel="noopener">רוצה לתאם ערב</a>
  <div class="sig g">באהבה, שירן</div>
  <img class="logo" src="logo.png" alt="שירנסקי מארח">
  <p class="terms">לאירוע אחד, בלי כפל מבצעים, ובכפוף לתיאום מראש עם שירנסקי מארח.</p>
</main>
<script>
// Tracking: Apps Script web app on the sheet "מעקב ברכות יום הולדת – שירנסקי מארח" (code: tools/birthday-apps-script.gs)
const TRACK_URL = "https://script.google.com/macros/s/AKfycbwN-o3pfSabA4FTw00DnQKTVXRWtkgwG1fuRkbwpvgE7BaaGb_Jx7BzDvD8bhfnemRh/exec";
const q = new URLSearchParams(location.search);
// n = full name (as in the tracking sheet); the card shows the first name only
const name = (q.get("n") || "").replace(/[<>\u0000-\u001f]/g, "").replace(/\s+/g, " ").trim().slice(0, 30);
const first = name.split(" ")[0];
const until = (q.get("t") || "").match(/^(\d{4})(\d{2})(\d{2})$/);
const sent = /^\d{8}$/.test(q.get("s") || "") ? q.get("s") : "";

if (first) {
  document.getElementById("hi").textContent = "מזל טוב, " + first + "!";
  document.title = "מזל טוב, " + first + "!";
}
if (until) {
  const v = document.getElementById("valid");
  v.textContent = "בתוקף עד " + (+until[3]) + "." + (+until[2]) + "." + until[1];
  v.hidden = false;
}
// "רוצה לתאם ערב" opens the Tally event form; hidden fields fill the name and the notes ("code" → הערות)
const form = new URL("https://tally.so/r/EkRN1A");
if (name) form.searchParams.set("name", name);
form.searchParams.set("code", "מתנת יומולדת 10%");
document.getElementById("book").href = form.toString();

function track(action) {
  if (!TRACK_URL) return;
  try {
    fetch(TRACK_URL, {method: "POST", mode: "no-cors", keepalive: true,
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({n: name, s: sent, a: action})});
  } catch (e) {}
}
track("כניסה");
document.getElementById("book").addEventListener("click", () => track("תיאום"));
</script>
</body>
</html>
